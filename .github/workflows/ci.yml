name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions

# Annule l'exécution précédente d'une même branche si on repousse un commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12","3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch CPU d'abord : évite de télécharger plusieurs Go de bibliothèques CUDA inutiles sur un runner sans GPU.
      # pip considère ensuite torch comme déjà satisfait lors de l'installation du projet.
      - name: Installer PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Installer le projet et les outils de test
        run: pip install -e ".[dev]"

      - name: Lancer pytest
        run: pytest -v
