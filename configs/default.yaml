# Configuration centrale pour le projet marine-inaturalist

paths:
  data_root: "C:/Users/pdelm/datasets/marine-inaturalist"
  keys_file: "C:/Users/pdelm/datasets/marine-inaturalist/train_keys.txt"
  images_dir: "C:/Users/pdelm/datasets/marine-inaturalist/images"
  manifests_dir: "C:/Users/pdelm/datasets/marine-inaturalist/manifests"
  checkpoints_dir: "C:/Users/pdelm/datasets/marine-inaturalist/checkpoints"
  logs_dir: "C:/Users/pdelm/datasets/marine-inaturalist/logs"

data:
  seed: 42
  sample_fraction: 0.22    # ~22 Go (~1,35 M d'images à ~16 Ko/image)
  val_ratio: 0.20
  image_size: 224          # Dimension cible (224x224) obtenue par redimensionnement complet (warp)
  decode_min_side: 224     # Cible de décodage rapide JPEG (draft) ; conserver >= image_size
  num_classes: 2185

download:
  max_workers: 32          # Nombre de threads parallèles pour absorber la latence HTTPS
  timeout_sec: 10

model:
  name: "cnn_rnn"
  in_channels: 3
  base_channels: 32
  rnn_type: "rnn"          # "rnn" | "gru" | "lstm" (basculer sur "gru" en cas d'instabilité)
  rnn_hidden_size: 256
  rnn_layers: 2
  rnn_nonlinearity: "tanh" # Utilisé uniquement lorsque rnn_type == "rnn"
  bidirectional: true
  dropout: 0.3

train:
  epochs: 20
  batch_size: 128
  num_workers: 6           # Tester 6 à 8 si l'utilisation GPU reste faible
  prefetch_factor: 2
  channels_last: true
  lr: 0.0014               # Taux d'apprentissage maximal après montée linéaire (warmup)
  warmup_epochs: 1.0       # Montée linéaire initiale, puis décroissance en cosinus par batch
  min_lr_ratio: 0.01       # Plancher cosinus = lr * min_lr_ratio
  weight_decay: 0.05       # Appliqué uniquement aux matrices de poids (hors biais et normalisations)
  label_smoothing: 0.1
  max_grad_norm: 1.0
  use_amp: true
